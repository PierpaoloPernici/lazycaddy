version: 2

project_name: lazycaddy

builds:
  - id: lazycaddy
    main: ./cmd/lazycaddy
    binary: lazycaddy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .FullCommit }}
        -X main.date={{ .Date }}

archives:
  - id: archives
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

release:
  header: |
    {{- if eq .Version "0.1.0" }}
    The first public release of lazycaddy is here: a read-only-by-default terminal UI for safely inspecting and editing Caddyfiles.

    This release establishes the core safety workflow: source preservation, validation, diff review, backups, atomic writes, and explicit Caddy reloads.
    {{- else if eq .Version "0.2.0" }}
    lazycaddy {{ .Version }} is now available.

    This release marks an important step for the project: lazycaddy is
    beginning to take shape as a practical and safe Caddyfile workflow,
    rather than just an early prototype.

    The application is now usable for day-to-day configuration inspection
    and maintenance, and is already being used in a real homelab environment.

    Read-only inspection remains fully supported, while the editing workflow
    is now robust enough for real use, with validation, diff review,
    external-change detection, backups, rollback and explicit Caddy reloads.
    {{- else if eq .Version "0.3.0" }}
    lazycaddy {{ .Version }} is now available.

    This release completes the v0.3 structured-editing milestone: the
    Caddyfile workflow is now fully structured, safe and reviewable.

    The tree navigates recursively through documents, sites, blocks and
    handler chains, with a searchable command palette (?) and pane-aware
    mouse selection with full clipboard integration. Editing is structured
    for the common directives: dedicated forms (m) for reverse_proxy,
    respond, redir, file_server, php_fastcgi, encode, header, tls, log and
    import, context-aware insertion (a), structural-node creation (n),
    exact-range deletion (d), same-document reordering (o) and editable
    top-level comment groups (e).

    Every operation keeps the Caddyfile as the single source of truth:
    edits are byte-preserving patches reviewed through a diff, validated by
    Caddy itself, backed up before writing, saved atomically and reloaded
    only when you ask. Ambiguous constructs refuse the form instead of
    guessing, and the raw editor remains the always-available escape hatch.
    {{- else if eq .Version "0.4.0" }}
    lazycaddy {{ .Version }} is now available.

    This release completes the v0.4 runtime and TLS observability milestone,
    while making the Caddyfile easier to inspect without compromising source
    fidelity or safety.

    It adds semantic source highlighting, matcher navigation, advisory inline
    validation, Caddy diagnostic mapping and display-only source folding. The
    new runtime and TLS dashboards expose loaded configuration, upstream
    health, certificate and storage state, while source-aware log filtering
    makes operational information easier to navigate.

    The release also includes a broad UI/UX refinement pass: responsive
    layouts for narrow terminals, clearer source headers, context-aware
    footers and command palettes, consistent master-detail navigation, and
    more predictable refresh and unavailable-state feedback across views.

    Source-aware views and editing workflows preserve comments, whitespace,
    ordering, imports and unknown directives, keeping the Caddyfile as the
    only source of truth.

    Runtime and TLS views remain read-only and cancellation-aware. The
    Caddyfile remains the source of truth, and no operation reloads or
    modifies Caddy implicitly.
    {{- else }}
    lazycaddy {{ .Version }} is now available.

    This release continues the safe, reviewable workflow for inspecting and editing Caddyfiles.
    {{- end }}

changelog:
  use: github-native
