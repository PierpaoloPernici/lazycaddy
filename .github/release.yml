changelog:
  exclude:
    labels:
      - skip-changelog

  categories:
    - title: "Breaking Changes 🛠"
      labels:
        - breaking-change

    - title: "Features ✨"
      labels:
        - enhancement

    - title: "Fixes 🔧"
      labels:
        - bug

    - title: "Maintenance ⚙️"
      labels:
        - dependencies
        - github_actions

    - title: "Documentation 📖"
      labels:
        - documentation

    - title: "Other Changes"
      labels:
        - "*"
